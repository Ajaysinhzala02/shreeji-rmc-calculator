<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SHREEJI RMC Rate Calculator</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #eef2f5;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
        }
        .calculator {
            background: #ffffff;
            padding: 25px 30px;
            border-radius: 12px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.12);
            max-width: 450px;
            width: 100%;
        }
        h2 {
            text-align: center;
            color: #1a252f;
            margin-bottom: 20px;
            border-bottom: 2px solid #28a745;
            padding-bottom: 10px;
        }
        label {
            font-weight: 600;
            display: block;
            margin-top: 15px;
            color: #333;
            font-size: 14px;
        }
        input, select {
            width: 100%;
            padding: 10px;
            margin-top: 6px;
            border: 1px solid #cccccc;
            border-radius: 6px;
            box-sizing: border-box;
            font-size: 14px;
        }
        input:focus, select:focus {
            border-color: #28a745;
            outline: none;
        }
        button {
            width: 100%;
            background-color: #28a745;
            color: white;
            border: none;
            padding: 12px;
            margin-top: 25px;
            border-radius: 6px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.3s ease;
        }
        button:hover {
            background-color: #218838;
        }
        .result-box {
            margin-top: 20px;
            padding: 15px;
            background: #f8f9fa;
            border-left: 4px solid #28a745;
            border-radius: 4px;
        }
        .result-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 8px;
            font-size: 14px;
            color: #555;
        }
        .result-row.total {
            font-size: 18px;
            font-weight: bold;
            color: #1a252f;
            border-top: 1px solid #ddd;
            padding-top: 8px;
            margin-top: 10px;
        }
    </style>
</head>
<body>

<div class="calculator">
    <h2>SHREEJI RMC Rate Calculator</h2>
    
    <!-- 1. Concrete Grade Selection -->
    <label for="grade">Concrete Grade (Rate per Cum):</label>
    <select id="grade">
        <option value="3200">M20 (₹3,200/cum)</option>
        <option value="3600" selected>M25 (₹3,600/cum)</option>
        <option value="4000">M30 (₹4,000/cum)</option>
        <option value="4400">M35 (₹4,400/cum)</option>
        <option value="4800">M40 (₹4,800/cum)</option>
    </select>

    <!-- 2. Quantity Input -->
    <label for="quantity">Quantity (in Cum):</label>
    <input type="number" id="quantity" placeholder="e.g. 10" value="10" min="1">

    <!-- 3. Delivery / Transport Charge -->
    <label for="lead">Delivery Distance (Km):</label>
    <input type="number" id="lead" placeholder="Distance in Km" value="5" min="0">

    <!-- 4. Pumping / Boom Placer Charge -->
    <label for="pumping">Pumping / Boom Placer Charges (₹):</label>
    <input type="number" id="pumping" placeholder="Fixed amount" value="2000" min="0">

    <!-- 5. GST Percentage -->
    <label for="gst">GST Rate (%):</label>
    <select id="gst">
        <option value="18" selected>18%</option>
        <option value="12">12%</option>
        <option value="5">5%</option>
        <option value="0">0% (Exempted)</option>
    </select>

    <button onclick="calculateRate()">Calculate Total</button>

    <!-- Result Display Section -->
    <div class="result-box" id="resultBox">
        <div class="result-row">
            <span>Base Concrete Cost:</span>
            <span id="baseCost">₹0</span>
        </div>
        <div class="result-row">
            <span>Transport Charge:</span>
            <span id="transportCost">₹0</span>
        </div>
        <div class="result-row">
            <span>Pumping Charge:</span>
            <span id="pumpingCost">₹0</span>
        </div>
        <div class="result-row">
            <span>GST Amount:</span>
            <span id="gstCost">₹0</span>
        </div>
        <div class="result-row total">
            <span>Grand Total:</span>
            <span id="grandTotal">₹0</span>
        </div>
    </div>
</div>

<script>
    function calculateRate() {
        let rate = parseFloat(document.getElementById('grade').value) || 0;
        let qty = parseFloat(document.getElementById('quantity').value) || 0;
        let km = parseFloat(document.getElementById('lead').value) || 0;
        let pump = parseFloat(document.getElementById('pumping').value) || 0;
        let gstPercent = parseFloat(document.getElementById('gst').value) || 0;

        // Calculations
        let baseCost = rate * qty;
        let transportCost = km * 50 * qty; // Standard ₹50 per km per cum
        let subTotal = baseCost + transportCost + pump;
        let gstCost = (subTotal * gstPercent) / 100;
        let grandTotal = subTotal + gstCost;

        // Render Outputs
        document.getElementById('baseCost').innerText = "₹" + baseCost.toLocaleString('en-IN');
        document.getElementById('transportCost').innerText = "₹" + transportCost.toLocaleString('en-IN');
        document.getElementById('pumpingCost').innerText = "₹" + pump.toLocaleString('en-IN');
        document.getElementById('gstCost').innerText = "₹" + gstCost.toLocaleString('en-IN');
        document.getElementById('grandTotal').innerText = "₹" + grandTotal.toLocaleString('en-IN');
    }

    // Auto calculate on load
    calculateRate();
</script>

</body>
</html>
